<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmação - Maria Clara</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Lilita+One&family=Passion+One:wght@400;700;900&display=swap');


        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Lilita One', 'Passion One', sans-serif;
            font-weight: lighter;
            background-image: url("background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        main {
            width: 100%;
            max-width: 380px;

            padding: 30px 25px;

            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin: 0 0 35px;
            color: #dd60ad;
            font-size: 28px;
            text-align: center;
        }

        .subtitulo {
            margin: 0 0 25px;
            color: #666;
            text-align: center;
            font-family: 'Lilita One', 'Passion One', sans-serif;
            font-weight: lighter;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #dd60ad;
            font-weight: bold;
            font-family: 'Lilita One', 'Passion One', sans-serif;
        }

        input {
            width: 100%;
            height: 48px;

            margin-bottom: 18px;
            padding: 10px 12px;

            border: 2px solid #dd60ad;
            border-radius: 10px;

            background: #fff0f6;

            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #c94e9d;
        }

        /* Botões de acompanhantes */

        .opcoes-acompanhantes {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .opcao {
            width: auto;
            min-width: 70px;
            padding: 12px 18px;

            border: 2px solid #dd60ad;
            border-radius: 10px;

            background: white;
            color: #dd60ad;

            font-family: 'Lilita One', 'Passion One', sans-serif;
            font-size: 16px;

            cursor: pointer;
        }

        .opcao.selecionada {
            background: #dd60ad;
            color: white;
        }

        .opcao:hover {
            background: #fff0f6;
        }

        .opcao.selecionada:hover {
            background: #c94e9d;
        }

        /* Botão de confirmação */

        button[type="submit"] {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 25px;

            background: #dd60ad;
            color: white;

            font-family: 'Lilita One', 'Passion One', sans-serif;
            font-size: 17px;

            cursor: pointer;
        }

        button[type="submit"]:hover {
            background: #c94e9d;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            main {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }

        }
    </style>
</head>

<body>

    <main>

        <h1>Confirme sua presença!</h1>

        <form id="formulario">

            <label for="nomeCrianca">
                Nome da criança
            </label>

            <input type="text" id="nomeCrianca" placeholder="Digite o nome" required>


            <label>
                Serão quantos acompanhantes?
            </label>

            <div class="opcoes-acompanhantes">

                <button type="button" class="opcao" data-acompanhantes="1 acompanhante">
                    1
                </button>

                <button type="button" class="opcao" data-acompanhantes="2 acompanhantes">
                    2
                </button>

                <button type="button" class="opcao" data-acompanhantes="3 acompanhantes">
                    3
                </button>

            </div>


            <button type="submit">
                Confirmar Presença
            </button>

        </form>

    </main>


    <script>

        const formulario = document.getElementById("formulario");

        const opcoes = document.querySelectorAll(".opcao");

        let acompanhantesSelecionados = "";


        // Selecionar acompanhante

        opcoes.forEach(function (opcao) {

            opcao.addEventListener("click", function () {

                opcoes.forEach(function (item) {
                    item.classList.remove("selecionada");
                });

                opcao.classList.add("selecionada");

                acompanhantesSelecionados =
                    opcao.dataset.acompanhantes;

            });

        });


        // Enviar confirmação

        formulario.addEventListener("submit", function (event) {

            event.preventDefault();


            const nomeCrianca = document
                .getElementById("nomeCrianca")
                .value
                .trim();


            if (!acompanhantesSelecionados) {

                alert("Selecione quem irá acompanhar a criança.");

                return;

            }


            const mensagem = `Olá! 😊 Estou passando para confirmar a presença na festa da Maria Clara! 🎂🐾

Cada criança convidada poderá vir acompanhada do papai, da mamãe e de irmão(ã), se desejar.

*ATENÇÃO, PATRULHEIROS(AS)! 🐾 Lembrando que convidado não convida.*

Criança: ${nomeCrianca}
Acompanhantes: ${acompanhantesSelecionados}`;


            const url =
                `https://wa.me/5585988667435?text=${encodeURIComponent(mensagem)}`;


            window.location.href = url;

        });

    </script>

</body>

</html>
